<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Jewel Crush · 动画对照预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14161f;color:#eee;font:14px system-ui;display:flex;justify-content:center;gap:40px;padding:18px;height:100vh}aside{width:250px;padding-top:24px}h1{font-size:23px}p{line-height:1.8;color:#b9bdcc}button{display:block;border:1px solid #484c60;border-radius:10px;background:#262a3a;color:white;padding:12px 16px;width:100%;margin:10px 0;cursor:pointer;text-align:left}button.active{background:#4b5286;border-color:#a9b1ff}#phone{width:360px;height:660px;overflow:hidden;border-radius:14px;border:1px solid #4b4e60;box-shadow:0 15px 60px #0008;background:#f7f4ff}iframe{width:720px;height:1320px;transform:scale(.5);transform-origin:top left;border:0}.note{font-size:12px;color:#9297ab}a{color:#bac3ff}
</style><aside><h1>棋子动画对照预览</h1><p>第 2—6 关复杂拼图。直接切换关卡，不修改正式解锁进度。</p><nav>
<button onclick="load(1,this)">01 · 教学回归</button><button class="active" onclick="load(2,this)">02 · 珠光小象 · 425 格</button><button onclick="load(3,this)">03 · 彩翼蝴蝶 · 568 格</button><button onclick="load(4,this)">04 · 锦鲤环游 · 450 格</button><button onclick="load(5,this)">05 · 热带鹦鹉 · 348 格</button><button onclick="load(6,this)">06 · 花卉长颈瓶 · 2545 格</button></nav><p class="note">选中同色连片 → 点击空托盘暂存。<br>选中托盘同色棋子 → 点击对应颜色空位。<br>剩余同色保持抬起；正确棋子锁定。<br>区域填满闪亮，整图完成后播放波浪扫光。</p><p class="note">需要 Cocos Creator 开启浏览器预览（7456 端口）。</p></aside><div id="phone"><iframe id="game" title="Cocos 游戏预览" src="http://localhost:7456/?preview-level=2"></iframe></div>
<script>function load(level,button){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));button.classList.add('active');document.getElementById('game').src='http://localhost:7456/?preview-level='+level}</script></html>
